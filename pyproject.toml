[project]
name = "cja-pre-commit"
version = "0.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cja==0.10.0",
]

[project.scripts]
cja-format-changed = "cja_pre_commit:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cja_pre_commit"]
